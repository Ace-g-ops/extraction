name: Sync Substack to WordPress

on:
  schedule:
    # UTC. Hourly (minute 7 avoids the busy top-of-hour queue).
    - cron: '7 * * * *'
  workflow_dispatch: {}   # run it manually from the Actions tab

concurrency:
  group: sync-substack
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (cached after the first run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: blogsync:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Probe the feed from the runner
        run: |
          echo "default agent:"
          curl -s -o /dev/null -w "%{http_code}\n" "$FEED" || true
          echo "browser-like agent:"
          curl -s -o /dev/null -w "%{http_code}\n" -A "Mozilla/5.0 (compatible; BlogSync/1.0)" "$FEED" || true
        env:
          FEED: ${{ vars.SUBSTACK_FEED_URL }}

      - name: Run the sync inside the container
        run: |
          docker run --rm \
            -e APP_ENV -e APP_DEBUG -e APP_KEY \
            -e DB_CONNECTION -e DB_URL \
            -e WPCOM_ACCESS_TOKEN -e WPCOM_SITE \
            -e SUBSTACK_FEED_URL -e SUBSTACK_SYNC_AFTER -e WP_POST_STATUS \
            blogsync:latest
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
          APP_KEY: ${{ secrets.APP_KEY }}
          DB_CONNECTION: pgsql
          DB_URL: ${{ secrets.DB_URL }}
          WPCOM_ACCESS_TOKEN: ${{ secrets.WPCOM_ACCESS_TOKEN }}
          WPCOM_SITE: ${{ vars.WPCOM_SITE }}
          SUBSTACK_FEED_URL: ${{ vars.SUBSTACK_FEED_URL }}
          SUBSTACK_SYNC_AFTER: ${{ vars.SUBSTACK_SYNC_AFTER }}
          WP_POST_STATUS: ${{ vars.WP_POST_STATUS }}